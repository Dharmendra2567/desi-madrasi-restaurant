<!doctype html>
<!-- Source for /og-image.jpg (1200×630 social preview). Regenerate with headless Chrome:
     chrome --headless=new --window-size=1200,630 --screenshot=og-image.png http://localhost:5180/tools/og-source.html (dev server running); save as public/og-image.png -->
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="robots" content="noindex" />
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;800&family=Cormorant+Garamond:ital,wght@1,600&family=Mulish:wght@700&display=swap" rel="stylesheet" />
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body { background: radial-gradient(ellipse at 25% 40%, #5a1420 0%, #3d070e 45%, #1c0306 100%); color: #fbf4e6; font-family: Mulish, sans-serif; position: relative; }
  .frame { position: absolute; inset: 18px; border: 1px solid rgba(224,165,38,.45); border-radius: 6px; }
  .left { position: absolute; left: 70px; top: 70px; width: 560px; }
  .logo-row { display: flex; align-items: center; gap: 18px; }
  .logo { width: 92px; height: 92px; border-radius: 50%; object-fit: cover; box-shadow: 0 0 0 3px #e0a526; background: #000; }
  .tm { font-size: 14px; color: #e0a526; font-weight: 700; align-self: flex-start; margin-left: -12px; }
  h1 { font-family: Cinzel, serif; font-weight: 800; font-size: 64px; line-height: 1.02; margin: 30px 0 10px; letter-spacing: .01em; }
  .tag { font-family: 'Cormorant Garamond', serif; font-style: italic; font-weight: 600; font-size: 38px; color: #f1d48a; margin: 0 0 26px; }
  .dishes { font-size: 20px; letter-spacing: .14em; text-transform: uppercase; color: #e0a526; line-height: 1.7; }
  .loc { margin-top: 26px; font-size: 21px; color: rgba(251,244,230,.85); }
  .pol { position: absolute; background: #fffaf0; padding: 9px; border-radius: 4px; box-shadow: 0 24px 50px -16px rgba(0,0,0,.75); }
  .pol img { display: block; width: 190px; height: 252px; object-fit: cover; }
  .p1 { left: 650px; top: 120px; transform: rotate(-8deg); }
  .p2 { left: 960px; top: 70px; transform: rotate(7deg); }
  .p3 { left: 800px; top: 250px; transform: rotate(-1deg); z-index: 2; }
</style>
</head>
<body>
  <div class="frame"></div>
  <div class="left">
    <div class="logo-row"><img class="logo" src="/desi-madrasi-restaurant-logo.jpeg" alt="" /><span class="tm">TM</span></div>
    <h1>Desi Madrasi</h1>
    <p class="tag">Tradition meets the taste</p>
    <div class="dishes">Bagara · Dum Biryani · Madrasi Biryani<br />Combos · Thalis · Sukka</div>
    <div class="loc">Kondapur, Hyderabad · Served on a banana leaf</div>
  </div>
  <div class="pol p1"><img src="/images/real/combo-tray.png" alt="" /></div>
  <div class="pol p2"><img src="/images/real/bagara-leaf.png" alt="" /></div>
  <div class="pol p3"><img src="/images/real/biryani-leaf.png" alt="" /></div>
</body>
</html>
